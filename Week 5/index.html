<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Looper Amp - Midterm: Looping</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:#fff; font-family:Arial, Helvetica, sans-serif; display:flex; justify-content:center; padding:24px 16px; overflow-x:auto; }
  main { width:100%; max-width:1000px; min-width:700px; }

  /* Screen: 8 in x 3 in = 8:3. Everything inside scales with the screen width (cqw). */
  #screen { aspect-ratio:8/3; container-type:inline-size; display:flex; padding:12px; background:#000; border:3px solid #3a3a3c; border-radius:14px; overflow:hidden; }
  .panel { flex:1; min-height:0; position:relative; background:#000; padding:1.2cqw; display:flex; align-items:center; justify-content:center; }
  svg { display:block; fill:currentColor; }
  button { border:none; cursor:pointer; color:#fff; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }

  /* The loop ring */
  #ringWrap { position:relative; height:100%; aspect-ratio:1/1; }
  #ring { width:100%; height:100%; }
  #ring circle { fill:none; }
  #play { position:absolute; left:50%; top:50%; width:34%; height:34%; transform:translate(-50%,-50%); border-radius:50%; display:grid; place-items:center; background:#2c2c2e; color:#fff; }
  #play:hover:not(:disabled) { background:#3a3a3c; }
  #play svg { width:44%; }
  @keyframes soft { 0%, 100% { opacity:.85; } 50% { opacity:.22; } }
  #ring circle.blink { animation:soft 1.4s ease-in-out infinite; }       /* recording: faint green, gently pulsing */
  @media (prefers-reduced-motion: reduce) { #ring circle.blink { animation:none; opacity:.4 !important; } }

  /* Record (Apple style: red dot inside a thin white ring) and Loop, bottom-left */
  #rec, #loop { position:absolute; left:2cqw; bottom:2cqw; width:6cqw; height:6cqw; border-radius:50%; padding:0; display:grid; place-items:center; background:none; }
  #rec svg { width:100%; height:100%; fill:none; }
  #rec.armed { animation:soft 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { #rec.armed { animation:none; } }
  #rec:hover:not(:disabled) { transform:scale(1.06); }
  #loop { left:9.5cqw; background:#2c2c2e; color:#8e8e93; }
  #loop svg { width:50%; }
  #loop:hover:not(:disabled) { background:#3a3a3c; }
  #loop.on, #loop.on:hover:not(:disabled) { background:#0a84ff; color:#fff; }
  /* Delete latest layer, bottom-right — matches the round Loop control. */
  #delete { position:absolute; right:2cqw; bottom:2cqw; width:6cqw; height:6cqw; border-radius:50%; padding:0; display:grid; place-items:center; background:transparent; color:#fff; }
  #delete svg { width:100%; height:100%; fill:none; stroke:currentColor; stroke-linecap:square; stroke-linejoin:round; }
  #delete:hover:not(:disabled) { transform:scale(1.06); }


  /* Ready-made tune library for non-guitarist testing. */
  #library { margin-top:24px; background:#141416; border:1px solid #36363a; border-radius:18px; padding:22px; color:#fff; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .part-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
  .part {
    min-height:126px; border-radius:16px; padding:12px 10px 14px; background:#242428; border:1px solid #39393e;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#eaeaf0; position:relative; text-align:center;
  }
  .part[data-part="guitar"] { --tint:#30d158; }
  .part[data-part="drums"] { --tint:#0a84ff; }
  .part[data-part="bass"] { --tint:#ff9f0a; }
  .part.selected { border-color:var(--tint); box-shadow:inset 0 0 0 1px var(--tint); }
  .part svg { width:56px; height:56px; fill:none; stroke:var(--tint); stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
  .guitar-reference-icon { width:60px; height:60px; object-fit:contain; filter:drop-shadow(0 0 0 transparent); }
  .part-label { font-size:14px; font-weight:700; letter-spacing:.01em; color:#ffffff; }
  @media(max-width:640px) { #library { padding:18px; } }

  /* iPad / touchscreen: occupy the full viewport in landscape without scrolling. */
  @media (hover:none) and (pointer:coarse) and (orientation:landscape) and (min-width:700px) {
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
               max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      align-items:stretch;
    }
    main {
      width:100%; max-width:none; min-width:0;
      height:100%; height:100dvh;
      /* Safe-area padding is on body, so subtract it from the main's full height. */
      height:calc(100dvh - max(8px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom)));
      display:grid;
      grid-template-rows:minmax(0, 1fr) minmax(130px, 27%);
      gap:12px;
    }
    #screen { width:100%; height:100%; min-height:0; aspect-ratio:auto; padding:7px; border-radius:13px; }
    .panel { padding:8px; }
    #ringWrap { height:min(100%, 65vw); max-width:100%; }
    #rec, #loop, #delete {
      width:clamp(48px, 6.7vw, 76px); height:clamp(48px, 6.7vw, 76px);
      bottom:clamp(10px, 1.8vw, 24px);
      touch-action:manipulation;
    }
    #rec { left:clamp(10px, 1.8vw, 24px); }
    #loop { left:calc(clamp(10px, 1.8vw, 24px) + clamp(48px, 6.7vw, 76px) + 12px); }
    #delete { right:clamp(10px, 1.8vw, 24px); }
    #library { margin:0; min-height:0; padding:10px 14px; border-radius:13px; display:flex; align-items:stretch; }
    .part-grid { flex:1; width:100%; height:100%; gap:12px; }
    .part { min-height:0; height:100%; gap:6px; padding:8px; touch-action:manipulation; }
    .part svg { width:clamp(42px, 6vw, 68px); height:clamp(42px, 6vw, 68px); }
    .guitar-reference-icon { width:clamp(44px, 6.3vw, 70px); height:clamp(44px, 6.3vw, 70px); }
    .part-label { font-size:clamp(13px, 1.6vw, 18px); }
  }
  /* Smaller/portrait iPads: fit the width and stack sections without horizontal scrolling. */
  @media (hover:none) and (pointer:coarse) and (orientation:portrait) {
    body { padding:12px; overflow-x:hidden; }
    main { min-width:0; max-width:none; width:100%; }
    #screen { width:100%; aspect-ratio:8/4.7; }
    #rec, #loop, #delete { width:clamp(40px, 7vw, 60px); height:clamp(40px, 7vw, 60px); bottom:12px; }
    #rec { left:12px; }
    #loop { left:calc(12px + clamp(40px, 7vw, 60px) + 8px); }
    #delete { right:12px; }
    #library { margin-top:12px; }
  }
</style>
</head>
<body>
<main>
<div id="screen">
  <section class="panel">
    <div id="ringWrap">
      <svg id="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <!-- Soft tonal gradients: same hues, with gentle light-to-dark transitions. -->
          <linearGradient id="greenGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#83eeb1"/>
            <stop offset="42%" stop-color="#44d98a"/>
            <stop offset="100%" stop-color="#24a979"/>
          </linearGradient>
          <linearGradient id="blueGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8bc7ff"/>
            <stop offset="45%" stop-color="#4b9ef5"/>
            <stop offset="100%" stop-color="#4d72d2"/>
          </linearGradient>
          <linearGradient id="orangeGradient" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffe4a4"/>
            <stop offset="45%" stop-color="#ffc16a"/>
            <stop offset="100%" stop-color="#e88a51"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="88" stroke="#2a2a2c" stroke-width="12"/>
        <circle cx="100" cy="100" r="72" stroke="#2a2a2c" stroke-width="12"/>
        <circle cx="100" cy="100" r="56" stroke="#2a2a2c" stroke-width="12"/>
        <circle id="f0" cx="100" cy="100" r="88" stroke="#30d158" stroke-width="12" stroke-dasharray="0 553"/>
        <circle id="f1" cx="100" cy="100" r="72" stroke="url(#blueGradient)" stroke-width="12" stroke-dasharray="0 453"/>
        <circle id="f2" cx="100" cy="100" r="56" stroke="url(#orangeGradient)" stroke-width="12" stroke-dasharray="0 352"/>
        <!-- Playback progress: bright arc over each translucent recorded ring. -->
        <circle id="p0" cx="100" cy="100" r="88" stroke="#30d158" stroke-width="12" stroke-dasharray="0 553" transform="rotate(-90 100 100)" pointer-events="none"/>
        <circle id="p1" cx="100" cy="100" r="72" stroke="url(#blueGradient)" stroke-width="12" stroke-dasharray="0 453" transform="rotate(-90 100 100)" pointer-events="none"/>
        <circle id="p2" cx="100" cy="100" r="56" stroke="url(#orangeGradient)" stroke-width="12" stroke-dasharray="0 352" transform="rotate(-90 100 100)" pointer-events="none"/>
        <line id="hand" x1="100" y1="4" x2="100" y2="52" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <button id="play" aria-label="Play" disabled>
        <svg id="icPlay" viewBox="0 0 48 48"><polygon points="12,6 42,24 12,42"/></svg>
        <svg id="icPause" viewBox="0 0 48 48" style="display:none"><rect x="9" y="6" width="11" height="36" rx="2"/><rect x="28" y="6" width="11" height="36" rx="2"/></svg>
      </button>
    </div>
    <button id="rec" aria-label="Record">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" stroke="#fff" stroke-width="4"/><circle id="icRec" cx="24" cy="24" r="16" fill="#ffffff"/><rect id="icStop" x="15" y="15" width="18" height="18" rx="4" fill="#e54d3f" style="display:none"/></svg>
    </button>
    <button id="loop" class="on" aria-pressed="true" aria-label="Loop" disabled>
      <svg viewBox="0 0 48 48"><path d="M38 24A14 14 0 1 1 29 11" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><polygon points="22,2 38,11 24,19"/></svg>
    </button>
    <button id="delete" aria-label="Delete last layer" title="Delete last layer" disabled>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke-width="4"/>
        <path d="M16 16L32 32M32 16L16 32" stroke-width="5"/>
      </svg>
    </button>
  </section>
</div>

<section id="library" aria-label="Premade tune library">
  <div class="part-grid" role="group" aria-label="Select instrument to record">
    <button class="part selected" data-part="guitar" aria-pressed="true" aria-label="Guitar" title="Guitar">

<script>
// This single HTML file includes synthesized guitar, drums and keyboard audio, without external resources.
// The three preset parts are all exactly 4 seconds long and repeat in sync.
const $ = id => document.getElementById(id);
const MAX_LAYERS = 3, CIRC = [553,453,352], LOOP_SECS = 4;
const state = { mode:'idle', playing:false, loopOn:true, layers:[], loopSecs:0, position:0, layerTime:0, chosenStyle:'indie', chosenPart:'guitar', currentRecording:null };
let audio = null, lastTick=performance.now(), previewUntil=0;
const parts=['guitar','drums','bass'];
const banks={
 indie:{chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]], bass:[36,33,29,31], lead:[72,76,74,69,72,76,79,74]},
 rock:{chords:[[52,59,64],[48,55,60],[55,62,67],[50,57,62]], bass:[40,36,43,38], lead:[76,74,72,79,76,74,71,74]},
 chill:{chords:[[60,64,67,71],[55,59,62,67],[57,60,64,69],[53,57,60,64]], bass:[36,31,33,29], lead:[72,71,67,69,72,76,74,67]}
};
function ensureAudio(){
  if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended') audio.resume();
  return audio;
}
// Lightweight offline instrument synthesis.  Guitar uses a plucked-string model;
// keyboard uses decaying piano-like partials; drums use separate noise/tone envelopes.
function midiHz(m){return 440*Math.pow(2,(m-69)/12);}
function pluck(midi,when,length=.9,volume=.12){
  const ctx=ensureAudio(), sr=ctx.sampleRate, hz=midiHz(midi), delay=Math.max(2,Math.round(sr/hz));
  const duration=Math.min(2.2,length+.5), count=Math.ceil(sr*duration);
  const buffer=ctx.createBuffer(1,count,sr), samples=buffer.getChannelData(0);
  const comb=new Float32Array(delay);
  for(let i=0;i<delay;i++) comb[i]=(Math.random()*2-1)*.72;
  let idx=0,previous=0;
  for(let i=0;i<count;i++){
    const current=comb[idx];
    comb[idx]=.996*(current+previous)*.5;
    previous=current;
    idx=(idx+1)%delay;
    const attack=Math.min(1,i/(sr*.005));
    const release=Math.min(1,Math.max(0,(count-i)/(sr*.12)));
    samples[i]=current*attack*release;
  }
  const source=ctx.createBufferSource(), filter=ctx.createBiquadFilter(), gain=ctx.createGain();
  source.buffer=buffer;filter.type='lowpass';filter.frequency.value=3500;
  gain.gain.value=volume;
  source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
  source.start(when);
}
function piano(midi,when,length=.55,volume=.09){
  const ctx=ensureAudio(), base=midiHz(midi), master=ctx.createGain();
  master.gain.value=volume;master.connect(ctx.destination);
  [1,2,3,4].forEach((partial,i)=>{
    const osc=ctx.createOscillator(),amp=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(base*partial*(1+i*.0004),when);
    const peak=[.8,.23,.10,.045][i];
    amp.gain.setValueAtTime(.0001,when);
    amp.gain.exponentialRampToValueAtTime(peak,when+.008+i*.002);
    amp.gain.exponentialRampToValueAtTime(.0001,when+Math.max(.18,length*(i===0?1.8:1.05-i*.12)));
    osc.connect(amp);amp.connect(master);osc.start(when);osc.stop(when+Math.max(.3,length*1.9)+.03);
  });
}
function noiseHit(when,kind,volume){
  const ctx=ensureAudio(),n=Math.ceil(ctx.sampleRate*(kind==='hat'?.085:.22));
  const buffer=ctx.createBuffer(1,n,ctx.sampleRate),v=buffer.getChannelData(0);
  for(let i=0;i<n;i++)v[i]=Math.random()*2-1;
  const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
  source.buffer=buffer;filter.type=kind==='hat'?'highpass':'bandpass';
  filter.frequency.value=kind==='hat'?7600:1750;
  gain.gain.setValueAtTime(volume,when);
  gain.gain.exponentialRampToValueAtTime(.0001,when+n/ctx.sampleRate);
  source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start(when);
}
function percussion(kind,when,vol=.1){
 const ctx=ensureAudio();
 if(kind==='kick'){
  const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';
  osc.frequency.setValueAtTime(155,when);osc.frequency.exponentialRampToValueAtTime(48,when+.14);
  gain.gain.setValueAtTime(Math.min(.5,vol*1.8),when);gain.gain.exponentialRampToValueAtTime(.0001,when+.23);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(when);osc.stop(when+.24);
 } else if(kind==='snare'){
  noiseHit(when,'snare',vol);
  const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.value=175;
  gain.gain.setValueAtTime(vol*.5,when);gain.gain.exponentialRampToValueAtTime(.0001,when+.12);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(when);osc.stop(when+.14);
 } else noiseHit(when,'hat',vol*.65);
}
// Each preset is a four-second, 16-step phrase. Keyboard is a dedicated piano-like part,
// not the old bass oscillator hidden behind a keyboard label.
function soundStep(part,style,step,when){
  const bank=banks[style];
  if(part==='guitar'){
    if(step%4===0){
      const chord=bank.chords[Math.floor(step/4)];
      chord.forEach((m,i)=>pluck(m-12,when+i*.026,.85,.095));
    }
    if(step%4===2)pluck(bank.lead[step%8]-12,when,.38,.06);
  } else if(part==='bass'){
    if(step%4===0){
      const chord=bank.chords[Math.floor(step/4)];
      chord.forEach((m,i)=>piano(m,when+i*.018,.75,.065));
    }
    if(step%2===1)piano(bank.lead[step%8],when,.3,.04);
  } else if(part==='drums'){
    if(step%4===0)percussion('kick',when,.16);
    if(step%8===4)percussion('snare',when,.16);
    if(step%2===0)percussion('hat',when,.12);
    if(style==='rock'&&step%8===6)percussion('kick',when,.10);
  }
}
// Playback and recording use a shared time position to preserve ring animation.
function playCrossed(oldPos,newPos,partsToPlay){
  if(!partsToPlay.length)return;
  const ctx=ensureAudio();
  const startStep=Math.floor(oldPos/.25)+1, endStep=Math.floor(newPos/.25);
  for(let step=startStep;step<=endStep;step++){
    const when=ctx.currentTime+.005;
    for(const x of partsToPlay)soundStep(x.part,x.style,step%16,when);
  }
}
function beginRecording(){
  ensureAudio();
  if(state.layers.length>=MAX_LAYERS)return;
  const selected={part:state.chosenPart,style:state.chosenStyle,fill:0,start:0};
  state.layers.push(selected);state.currentRecording=selected;state.layerTime=0;
  if(state.mode==='idle'){state.mode='recording';state.position=0;state.loopSecs=LOOP_SECS;state.playing=true;}
  else {state.mode='overdubbing';state.playing=true;}
  soundStep(selected.part,selected.style,0,ensureAudio().currentTime+.015);
  $('libraryStatus').textContent='Recording '+selected.part+'… wait four seconds or press Record to finish.';
}
function finishRecording(){
  if(!state.currentRecording)return;
  state.currentRecording.fill=1;state.currentRecording.start=0;
  state.currentRecording=null;state.layerTime=0;state.mode='loop';state.playing=false;state.position=0;
  $('libraryStatus').textContent=state.layers.length+' layer'+(state.layers.length===1?'':'s')+' saved. Press Play to hear your track, or select another instrument and Record.';
}
function fakeDevice(type){
  const s=state;
  if(type==='record'){
    if(s.mode==='recording'||s.mode==='overdubbing')finishRecording();
    else beginRecording();
  }
  if(type==='delete'&&s.layers.length){
    s.layers.pop();s.currentRecording=null;s.layerTime=0;
    if(!s.layers.length){s.mode='idle';s.playing=false;s.position=0;s.loopSecs=0;}
    else {s.mode='loop';s.playing=false;s.position=0;}
    $('libraryStatus').textContent=s.layers.length?'Last layer removed. '+s.layers.length+' remain.':'All layers cleared. Select a part and press Record.';
  }
  if(type==='loop')s.loopOn=!s.loopOn;
  if(type==='play' && s.mode==='loop') {ensureAudio();s.playing=!s.playing;if(s.playing&&s.position>=LOOP_SECS)s.position=0;if(s.playing&&s.position===0)s.layers.forEach(x=>soundStep(x.part,x.style,0,audio.currentTime+.015));}
  render();
}
function tick(){
  const now=performance.now(),dt=Math.min(.12,(now-lastTick)/1000);lastTick=now;
  const s=state;
  if(s.playing){
    let remaining=dt;
    while(remaining>0 && s.playing){
      const segment=Math.min(remaining,LOOP_SECS-s.position);
      const old=s.position, to=s.position+segment;
      // The recording currently in progress also plays its premade notes.
      playCrossed(old,to,s.layers);
      s.position=to;
      if(s.currentRecording){s.layerTime+=segment;s.currentRecording.fill=Math.min(1,s.layerTime/LOOP_SECS);}
      remaining-=segment;
      if(s.currentRecording && s.layerTime>=LOOP_SECS-.001){finishRecording();break;}
      if(s.position>=LOOP_SECS-.00001){
        if(s.loopOn)s.position=0;
        else {s.playing=false;s.position=0;break;}
      }
      if(segment<=0)break;
    }
  }
  render();
}
function render(){
  const s=state,busy=s.mode==='recording'||s.mode==='overdubbing';
  $('play').disabled=s.mode==='idle'||busy;
  $('icPlay').style.display=s.playing&&!busy?'none':'block';
  $('icPause').style.display=s.playing&&!busy?'block':'none';
  $('play').setAttribute('aria-label',s.playing?'Pause':'Play');
  $('rec').disabled=!busy&&s.layers.length>=MAX_LAYERS;
  $('icRec').style.display=busy?'none':'block';
  $('icStop').style.display=busy?'block':'none';
  $('rec').setAttribute('aria-label',busy?'Stop recording':'Record selected part');
  $('loop').disabled=s.mode==='idle'||busy;
  $('loop').classList.toggle('on',s.loopOn);
  $('loop').setAttribute('aria-pressed',s.loopOn);
  $('delete').disabled=s.layers.length===0;
  for(let i=0;i<MAX_LAYERS;i++){
    const f=$('f'+i),p=$('p'+i),layer=s.layers[i];
    f.style.opacity=layer?(layer===s.currentRecording?1:.6):0;
    f.setAttribute('stroke-dasharray',layer?'none':`0 ${CIRC[i]}`);
    f.setAttribute('transform','rotate(-90 100 100)');
    f.classList.toggle('blink',layer===s.currentRecording);
    const frac=s.loopSecs?Math.max(0,Math.min(1,s.position/s.loopSecs)):0;
    p.style.opacity=layer&&layer!==s.currentRecording&&frac>0?1:0;
    p.setAttribute('stroke-dasharray',`${CIRC[i]*frac} ${CIRC[i]}`);
  }
  $('hand').style.opacity=(s.mode==='idle'||busy)?0:1;
  $('hand').setAttribute('transform',`rotate(${s.loopSecs?s.position/s.loopSecs*360:0} 100 100)`);
}
$('rec').onclick=()=>fakeDevice('record');
$('play').onclick=()=>fakeDevice('play');
$('loop').onclick=()=>fakeDevice('loop');
$('delete').onclick=()=>fakeDevice('delete');
function updateSelection(){
  document.querySelectorAll('[data-part]').forEach(b=>{const on=b.dataset.part===state.chosenPart;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',on);});
  $('libraryStatus').textContent=state.chosenPart.charAt(0).toUpperCase()+state.chosenPart.slice(1)+' selected. Press Record above to add it.';
}
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{state.chosenPart=b.dataset.part;updateSelection();});
setInterval(tick,40);
render();
</script>
</body>
